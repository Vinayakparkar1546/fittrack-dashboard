apiVersion: apps/v1
kind: Deployment
metadata:
  name: fittrack-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fittrack
  template:
    metadata:
      labels:
        app: fittrack
    spec:
      containers:
        - name: fittrack
          image: fittrack-dashboard:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
